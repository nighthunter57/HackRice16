server {
    listen 80;
    server_name 64.177.45.109;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://64.177.45.109$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name 64.177.45.109;
    ssl_certificate /etc/letsencrypt/live/spendly-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spendly-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    root /var/www/spendly/current;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location / { try_files $uri $uri/ /index.html; }
    # Request URLs may contain password-reset tokens; omit access logging.
    access_log off;
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 65s;
    }
}
